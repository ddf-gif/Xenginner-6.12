<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LENS — AI 视觉对话</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d0d0d">
    <meta name="description" content="AI 视觉对话助手 — 让 AI 通过摄像头看见世界">
</head>
<body>

<!-- ================================================================ -->
<!--  LANDING                                                        -->
<!-- ================================================================ -->
<main id="landing" class="landing" aria-label="首页">
    <div class="landing-glow"></div>

    <div class="landing-body">
        <header class="landing-header">
            <p class="landing-kicker">Qwen Omni Realtime</p>
            <h1 class="landing-title">
                <span class="title-line">AI 视觉</span>
                <span class="title-line title-line--accent">对话助手</span>
            </h1>
            <p class="landing-desc">
                让 AI 通过你的摄像头看见世界，<br>用自然语言与你实时交流。
            </p>
        </header>

        <!-- Role selector -->
        <div class="role-select">
            <span class="role-label">AI 角色</span>
            <div class="role-options" id="role-options">
                <button class="role-btn active" data-role="assistant">🤖 通用助手</button>
                <button class="role-btn" data-role="teacher">📚 英语老师</button>
                <button class="role-btn" data-role="interviewer">💼 面试官</button>
                <button class="role-btn" data-role="friend">💬 朋友闲聊</button>
            </div>
        </div>

        <div class="landing-features">
            <div class="feat"><span class="feat-icon">&#9673;</span><span>实时视觉理解</span></div>
            <div class="feat"><span class="feat-icon">&#9673;</span><span>自然语音对话</span></div>
            <div class="feat"><span class="feat-icon">&#9673;</span><span>智能成本控制</span></div>
        </div>

        <button id="btn-enter" class="enter-btn" type="button">开始对话</button>
        <p class="landing-footnote">需要授权摄像头与麦克风权限</p>
    </div>
</main>

<!-- ================================================================ -->
<!--  CONVERSATION                                                   -->
<!-- ================================================================ -->
<div id="app" class="app" inert hidden>

    <!-- Particle canvas -->
    <canvas id="particles" class="particles"></canvas>

    <!-- Top bar -->
    <nav class="topbar" aria-label="工具栏">
        <button id="btn-back" class="topbar-btn" aria-label="返回首页" type="button">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 3L5 8l5 5"/></svg>
        </button>

        <div class="topbar-status">
            <span id="status-dot" class="status-dot" aria-hidden="true"></span>
            <span id="status-text" class="status-label">等待连接</span>
        </div>

        <span id="cost-display" class="topbar-cost" title="本次对话预估费用"></span>

        <div class="topbar-toggles">
            <label class="tgl" title="字幕"><input type="checkbox" id="subtitle-toggle" checked><span class="tgl-text">CC</span></label>
            <label class="tgl" title="语音播报"><input type="checkbox" id="audio-toggle" checked><span class="tgl-text">语音</span></label>
        </div>
    </nav>

    <!-- Body -->
    <div class="app-body">

        <!-- Camera panel -->
        <section class="camera-panel" aria-label="摄像头画面">
            <div id="camera-frame" class="camera-frame">
                <video id="camera-preview" autoplay playsinline muted></video>
                <canvas id="capture-canvas" hidden></canvas>

                <!-- HUD overlay -->
                <div class="hud-corners" aria-hidden="true">
                    <span class="hud-c hud-tl"></span><span class="hud-c hud-tr"></span>
                    <span class="hud-c hud-bl"></span><span class="hud-c hud-br"></span>
                </div>
                <div class="hud-crosshair" aria-hidden="true"></div>
                <div class="hud-scanlines" aria-hidden="true"></div>

                <div id="permission-overlay" class="camera-placeholder">
                    <span class="placeholder-ring" aria-hidden="true"></span>
                    <p>点击下方按钮开始对话</p>
                </div>

                <button id="btn-interrupt" class="interrupt-btn" type="button" hidden>打断</button>

                <div id="subtitle-bar" class="camera-subtitle" aria-live="polite">
                    <span id="subtitle-text"></span>
                </div>

                <!-- Audio waveform -->
                <canvas id="waveform" class="waveform" aria-hidden="true"></canvas>
            </div>

            <!-- Quick questions -->
            <div class="quick-asks" id="quick-asks">
                <button class="quick-btn" data-q="你看到了什么？">你看到了什么？</button>
                <button class="quick-btn" data-q="描述一下这个场景">描述一下这个场景</button>
                <button class="quick-btn" data-q="我手里拿的是什么？">我手里拿的是什么？</button>
            </div>

            <div class="camera-actions">
                <button id="btn-start" class="act act--primary" type="button">开始对话</button>
                <button id="btn-camera" class="act" disabled type="button" title="开关摄像头">摄像头</button>
                <button id="btn-stop" class="act act--stop" disabled type="button">停止</button>
            </div>

            <div class="audio-meter" id="audio-meter" aria-hidden="true">
                <div class="audio-meter-fill" id="meter-bar"></div>
            </div>
        </section>

        <!-- Chat panel -->
        <section class="chat-panel" aria-label="对话记录">
            <div class="chat-log" id="chat-messages">
                <div class="msg msg--system">
                    <p>准备好后点击「开始对话」，AI 将通过摄像头和麦克风与你交流。</p>
                </div>
            </div>
            <div class="chat-foot">
                <span class="chat-foot-hint" id="cost-hint">语音播报开启</span>
            </div>
        </section>
    </div>
</div>

<script src="/js/ui.js"></script>
<script src="/js/audio-capture.js"></script>
<script src="/js/video-capture.js"></script>
<script src="/js/ws-client.js"></script>
<script src="/js/audio-playback.js"></script>
<script src="/js/app.js"></script>
<script>
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js').catch(()=>{}); }
</script>
</body>
</html>
