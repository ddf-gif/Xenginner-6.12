<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 视觉对话助手</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <h1>🤖 AI 视觉对话助手</h1>
            <span class="version">v0.1.0</span>
        </header>

        <!-- Main content -->
        <div class="main-content">
            <!-- Video panel -->
            <div class="video-panel">
                <div class="video-wrapper">
                    <video id="camera-preview" autoplay playsinline muted></video>
                    <canvas id="capture-canvas" style="display:none;"></canvas>
                    <div id="permission-overlay" class="permission-overlay">
                        <div class="permission-icon">📷</div>
                        <p>点击「开始对话」授权摄像头与麦克风</p>
                    </div>
                </div>
                <div class="video-controls">
                    <button id="btn-start" class="btn btn-primary">
                        <span class="btn-icon">▶</span> 开始对话
                    </button>
                    <button id="btn-stop" class="btn btn-danger" disabled>
                        <span class="btn-icon">⏹</span> 停止
                    </button>
                </div>
            </div>

            <!-- Chat panel -->
            <div class="chat-panel">
                <div class="chat-header">
                    <span class="status-indicator" id="status-dot"></span>
                    <span id="status-text">等待连接</span>
                </div>
                <div class="chat-messages" id="chat-messages">
                    <div class="message system">
                        <p>你好！我是 AI 视觉对话助手。点击「开始对话」后，我可以看到你的摄像头画面并听到你说话。</p>
                    </div>
                </div>
                <!-- Audio mode toggle -->
                <div class="chat-footer">
                    <label class="toggle-label" title="开启语音播报（关闭则仅文字回复，节省费用）">
                        <input type="checkbox" id="audio-toggle" checked>
                        <span class="toggle-switch"></span>
                        <span class="toggle-text">语音播报</span>
                    </label>
                    <span class="cost-hint" id="cost-hint"></span>
                </div>
            </div>
        </div>

        <!-- Debug: audio level meter -->
        <div class="audio-meter" id="audio-meter">
            <div class="meter-bar" id="meter-bar"></div>
        </div>
    </div>

    <script src="/js/ui.js"></script>
    <script src="/js/audio-capture.js"></script>
    <script src="/js/video-capture.js"></script>
    <script src="/js/ws-client.js"></script>
    <script src="/js/audio-playback.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
